name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      # Packaging-correctness gate (dual CJS/ESM types + exports). attw exits non-zero on a
      # types masquerade / broken subpath; publint on a packaging error.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

  # Peer-resolvability matrix — the ONLY guard that catches a peer range that excludes a
  # real published version (incident b: lens peer `footprint-explainable-ui@^0.22.0` once
  # excluded eui 0.25). publint/attw never resolve dependencies; only an actual install
  # does. This installs the PACKED lens against the MIN and LATEST of each spanning peer
  # range, under strict npm>=7 resolution. An ERESOLVE here = the guard firing in CI,
  # before a consumer ever hits it. NEVER add --legacy-peer-deps / --force here.
  peer-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two peer ranges that actually vary in REACHABLE installs (as of the 7.x
        # family: agentfootprint 7.3.1 / footprint-explainable-ui 0.28.0-0.30.0 / footprintjs
        # 9.10.1 on npm — updated 2026-07-09, was pinned pre-7.x and ERESOLVEd every run
        # since 2026-07-02, the day agentfootprint 7.0.0 shipped):
        #   - footprint-explainable-ui >=0.28.0 <1.0.0  → min + latest published
        #   - react ^18.0.0 || ^19.0.0                  → both majors
        # agentfootprint and footprintjs are held fixed at the latest published version
        # satisfying lens's `^7.0.0` / `^9.10.0` peer ranges below — they don't vary
        # across reachable installs, so they're not separate matrix dimensions.
        eui: ["0.28.0", "0.30.0"]
        react: ["18.3.1", "19.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm pack # the exact tarball npm would publish

      - name: Install the packed lens against this peer combo (STRICT)
        run: |
          mkdir -p /tmp/scratch && cd /tmp/scratch && npm init -y >/dev/null
          npm install \
            "react@${{ matrix.react }}" "react-dom@${{ matrix.react }}" "@xyflow/react@^12.0.0" \
            "agentfootprint@7.3.1" "footprintjs@9.10.1" \
            "footprint-explainable-ui@${{ matrix.eui }}"
          # ERESOLVE on the next line = a peer range that excludes a real version = the guard.
          npm install "$GITHUB_WORKSPACE"/agentfootprint-lens-*.tgz

      - name: Assert single footprintjs/react instance + import smoke
        run: |
          cd /tmp/scratch
          npm ls footprintjs react react-dom --depth=0
          node --input-type=module -e "await import('agentfootprint-lens'); console.log('import ok')" || \
            echo "::warning::import smoke skipped (no-DOM env) — install resolution is the primary guard"
