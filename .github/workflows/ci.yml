name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: footprintjs/explainable-ui
          ref: 0af1a2d0d21edb0a86fb447b4c032c1f3d896412
          path: flow-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check authored cohort development pins
        run: node scripts/compat/check-source-pins.mjs
      - run: npm install -g npm@11.21.0
      - name: Exercise every ordinary registry helper and the explicit native refusals
        run: node --test scripts/compat/*.test.mjs scripts/compat/source-inputs/*.test.mjs
      - name: Exercise the bounded hostile archive controls without installing packages
        run: python3 -B -m unittest discover -s scripts/compat/source-inputs/archive_data -t scripts/compat/source-inputs -p '*_test.py' -v
      - name: Read the fixed native source input with this workflow's existing token
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/compat/source-inputs.mjs fetch --out "$RUNNER_TEMP/native-inputs"
      - name: Materialize the exact source with admitted originals and a genuine strict lock
        run: |
          node scripts/compat/source-inputs.mjs bootstrap --mode target --source "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/native-inputs" --target "$RUNNER_TEMP/native-target" --evidence "$RUNNER_TEMP/native-evidence"
      - name: Preserve contract, types, build, whole-suite, time-fixture and publint gates
        run: node scripts/compat/source-inputs.mjs gates --evidence "$RUNNER_TEMP/native-evidence"
      - name: Restore the authored manifest, pack once and check those exact declarations
        run: node scripts/compat/source-inputs.mjs pack --evidence "$RUNNER_TEMP/native-evidence" --out "$GITHUB_WORKSPACE/compat-artifacts"
      - name: Bind the single Lens archive and exact renderer to the original native inputs
        working-directory: ${{ runner.temp }}/native-target
        run: |
          why_archive="$(node scripts/compat/why-identity.mjs)"
          node scripts/compat/prepare-artifacts.mjs \
            --why-tar "$GITHUB_WORKSPACE/compat-artifacts/$why_archive" \
            --flow-source "$GITHUB_WORKSPACE/flow-candidate" --out "$GITHUB_WORKSPACE/compat-artifacts" \
            --source-inputs "$RUNNER_TEMP/native-inputs" --bootstrap-evidence "$RUNNER_TEMP/native-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-archives
          path: |
            compat-artifacts/*.tgz
            compat-artifacts/*.json
            compat-artifacts/*.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-node22
          path: |
            ${{ runner.temp }}/native-evidence/*.json
            ${{ runner.temp }}/native-evidence/*.log
          if-no-files-found: warn

  test-24:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check authored cohort development pins
        run: node scripts/compat/check-source-pins.mjs
      - run: npm install -g npm@11.21.0
      - name: Exercise every ordinary registry helper and the explicit native refusals
        run: node --test scripts/compat/*.test.mjs scripts/compat/source-inputs/*.test.mjs
      - name: Exercise the bounded hostile archive controls without installing packages
        run: python3 -B -m unittest discover -s scripts/compat/source-inputs/archive_data -t scripts/compat/source-inputs -p '*_test.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-archives
          path: compat-artifacts
      - name: Materialize the exact source with admitted originals and a genuine strict lock
        run: |
          node scripts/compat/source-inputs.mjs bootstrap --mode target --source "$GITHUB_WORKSPACE" --inputs "$GITHUB_WORKSPACE/compat-artifacts" --target "$RUNNER_TEMP/native-target" --evidence "$RUNNER_TEMP/native-evidence"
      - name: Preserve contract, types, build, whole-suite, time-fixture and publint gates
        run: node scripts/compat/source-inputs.mjs gates --evidence "$RUNNER_TEMP/native-evidence"
      - name: Bind Node24's tested build to the same Node22 original and check its declarations
        run: |
          node scripts/compat/source-inputs.mjs pack --evidence "$RUNNER_TEMP/native-evidence" --out "$RUNNER_TEMP/native-evidence" --existing "$GITHUB_WORKSPACE/compat-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-node24
          path: |
            ${{ runner.temp }}/native-evidence/*.json
            ${{ runner.temp }}/native-evidence/*.log
          if-no-files-found: warn

  published-commentary-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check authored cohort development pins
        run: node scripts/compat/check-source-pins.mjs
      - run: npm install -g npm@11.21.0
      - name: Bootstrap the separate published CONTROL directly, never through target AF15
        run: |
          node scripts/compat/source-inputs.mjs bootstrap --mode CONTROL --source "$GITHUB_WORKSPACE" --target "$RUNNER_TEMP/published-control" --evidence "$RUNNER_TEMP/control-evidence"
      - name: Preserve commentary assertions, build and the complete historical layout suite
        run: node scripts/compat/source-inputs.mjs gates --evidence "$RUNNER_TEMP/control-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-CONTROL-only
          path: |
            ${{ runner.temp }}/control-evidence/*.json
            ${{ runner.temp }}/control-evidence/*.log
          if-no-files-found: warn

  # Retire historical installed runtime cohorts. Keep historical record DATA
  # fixtures in the whole suite, plus public renderer floor/current/candidate.
  peer-matrix:
    needs: test
    runs-on: ubuntu-24.04
    # Official image supplies browsers + native libraries once; every lane still
    # proves its exact installed driver/binary and performs the full replay.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flow: ["0.34.0", "0.38.0", "candidate", "1.0.1"]
        react: ["18", "19"]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.flow == 'candidate'
        with:
          repository: footprintjs/explainable-ui
          ref: 0af1a2d0d21edb0a86fb447b4c032c1f3d896412
          path: flow-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check authored cohort development pins
        run: node scripts/compat/check-source-pins.mjs
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-archives
          path: compat-artifacts
      - name: Strict packed public runtime, declarations, native recording and browser replay
        run: |
          node scripts/compat/run-lane.mjs --kind native --flow "${{ matrix.flow }}" \
            --react "${{ matrix.react }}" --node "${{ matrix.node }}" \
            --artifacts compat-artifacts --evidence "$RUNNER_TEMP/compat-evidence" \
            --flow-source flow-candidate --install-browser yes --source-inputs compat-artifacts --browser-provisioning bundled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.flow }}-react${{ matrix.react }}-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/compat-evidence/*.json
            ${{ runner.temp }}/compat-evidence/*.log
            ${{ runner.temp }}/compat-evidence/*.tgz
            ${{ runner.temp }}/compat-evidence/consumer/package*.json
            ${{ runner.temp }}/compat-evidence/consumer-resolve/package*.json
            ${{ runner.temp }}/compat-evidence/consumer/native-recording.json
            ${{ runner.temp }}/compat-evidence/consumer/expected-cohort.json
            ${{ runner.temp }}/compat-evidence/record-only/package*.json
            ${{ runner.temp }}/compat-evidence/record-only-resolve/package*.json
            ${{ runner.temp }}/compat-evidence/record-browser/package*.json
            ${{ runner.temp }}/compat-evidence/record-browser-resolve/package*.json
            ${{ runner.temp }}/compat-evidence/browser/**
          if-no-files-found: error
