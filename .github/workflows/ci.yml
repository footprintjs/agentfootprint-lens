name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: footprintjs/explainable-ui
          ref: e3681ab46e01a2a03adf97a27d58df987fef4db8
          path: flow-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm PIN, and not a cosmetic one: npm 10 — what setup-node's node-22 still
      # ships — crashes resolving this dependency set with "Cannot read properties
      # of null (reading 'edgesOut')", an arborist bug tripped by a transitive
      # published after 2026-08-30. That is why 0.44.0's run was green and the very
      # next one was not, with no change to our own deps. Reproduced both ways:
      # npm 10.9.3 crashes, npm 11 resolves the same package.json cleanly. A
      # committed lockfile cannot paper over it (rolldown's native binding is a
      # platform optional dep, npm #4828), so the npm version IS the fix.
      - run: npm install -g npm@11.21.0
      - run: npm install --strict-peer-deps
      - run: npm run test:compat-helpers
      - run: npm run build
      - run: npm test
      # Packaging-correctness gate (dual CJS/ESM types + exports). attw exits non-zero on a
      # types masquerade / broken subpath; publint on a packaging error.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack
      - name: Pack one Why artifact and the exact reviewed Flow candidate
        run: |
          mkdir -p compat-artifacts
          why_archive="$(node scripts/compat/why-identity.mjs)"
          npm pack --ignore-scripts --pack-destination compat-artifacts
          node scripts/compat/prepare-artifacts.mjs \
            --why-tar "compat-artifacts/$why_archive" \
            --flow-source flow-candidate --out compat-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-archives
          path: |
            compat-artifacts/*.tgz
            compat-artifacts/contract.json
            compat-artifacts/*.log
          if-no-files-found: error

  # Check both dependency resolution and the packed runtime contract. A successful
  # install alone cannot catch a renderer that lacks a statically imported API.
  # NEVER add --legacy-peer-deps / --force or downgrade smoke failures to warnings.
  peer-matrix:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Renderer minimum + current published version, across both React majors.
        # 0.31 first exports overlayFromSnapshot; 0.34 first adds runtime.seed
        # and collapseTraceGraph. Lens needs all three, so 0.34 is the floor.
        # Keep this minimum aligned with the peer/dev ranges in package.json.
        # Hold agentfootprint/footprintjs/foottrace at their compatible floors.
        eui: ["0.34.0", "0.38.0"]
        react: ["18.3.1", "19.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-archives
          path: compat-artifacts
      - name: Preserve all four native floors with the same packed Why Lens
        run: |
          react_version="${{ matrix.react }}"
          node scripts/compat/run-lane.mjs --kind historical --flow "${{ matrix.eui }}" \
            --react "${react_version%%.*}" --node 22 --artifacts compat-artifacts --evidence compat-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor-${{ matrix.eui }}-react${{ matrix.react }}
          path: |
            compat-evidence/*.json
            compat-evidence/*.log
            compat-evidence/*.tgz
            compat-evidence/consumer/package*.json
          if-no-files-found: error

  # Genuine old/new combinations: normal installs of exactly the same Why
  # archive. The candidate is the reviewed tracked M6 archive, never rebuilt,
  # published, renamed from 0.x, or fetched from a mutable branch.
  flow-major-bridge:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flow: ["0.34.0", "0.38.0", "candidate"]
        react: ["18", "19"]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.flow == 'candidate'
        with:
          repository: footprintjs/explainable-ui
          ref: e3681ab46e01a2a03adf97a27d58df987fef4db8
          path: flow-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-archives
          path: compat-artifacts
      - name: Strict install, all public types, ownership and actual browser replay
        run: |
          node scripts/compat/run-lane.mjs --kind modern --flow "${{ matrix.flow }}" \
            --react "${{ matrix.react }}" --node "${{ matrix.node }}" \
            --artifacts compat-artifacts --evidence compat-evidence \
            --flow-source flow-candidate --install-browser yes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-${{ matrix.flow }}-react${{ matrix.react }}-node${{ matrix.node }}
          path: |
            compat-evidence/*.json
            compat-evidence/*.log
            compat-evidence/*.tgz
            compat-evidence/consumer/package*.json
            compat-evidence/record-only/package*.json
            compat-evidence/record-browser/package*.json
            compat-evidence/browser/**
          if-no-files-found: error

  # Keep all four FLOOR combinations above. The modern graph uses the published
  # AgentFootprint 10 plus either the published engine or the exact extracted
  # FootPrint source prepared with its normal version-only release step.
  # This is never a renamed 9.x implementation and never publishes a candidate.
  extracted-peers:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [published9, extracted10]
    defaults:
      run:
        working-directory: lens
    steps:
      - uses: actions/checkout@v4
        with:
          path: lens
      - uses: actions/checkout@v4
        if: matrix.engine == 'extracted10'
        with:
          repository: footprintjs/footPrint
          ref: 8ee851119ad7b6e9d4195fc9f53526c506fe153e
          path: engine-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-archives
          path: compat-artifacts
      - name: Build the exact extracted FootPrint 10 candidate (never publish)
        if: matrix.engine == 'extracted10'
        working-directory: engine-candidate
        run: |
          test "$(git rev-parse HEAD)" = 8ee851119ad7b6e9d4195fc9f53526c506fe153e
          # FootPrint deliberately has no committed lockfile (platform-native
          # build dependencies). Match its npm 11 fresh-install policy while
          # refusing peer conflicts; do not manufacture or bypass a lockfile.
          npm install --strict-peer-deps
          npm version major --no-git-tag-version --ignore-scripts
          node -e "if(require('./package.json').version !== '10.0.0') process.exit(1)"
          git diff --exit-code HEAD -- src
          npm run build
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import * as root from 'footprintjs';
          import * as trace from 'footprintjs/trace';
          for (const name of ['CommitRangeIndex', 'stateAt', 'timeTravel', 'sliceForKey', 'tagStops', 'pathSegments']) {
            assert.equal(name in root, false, `engine root still owns ${name}`);
            assert.equal(name in trace, false, `engine trace still owns ${name}`);
          }
          NODE
          npm pack --ignore-scripts
      - name: Install Lens against the modern graph with unchanged peer declarations
        run: |
          npm pkg set devDependencies.agentfootprint=10.0.0 devDependencies.foottrace=1.0.0 devDependencies.footprint-explainable-ui=0.38.2
          if [ "${{ matrix.engine }}" = extracted10 ]; then
            npm pkg set devDependencies.footprintjs=file:../engine-candidate/footprintjs-10.0.0.tgz
          else
            npm pkg set devDependencies.footprintjs=9.48.3
          fi
          npm install --strict-peer-deps
          npm ls agentfootprint footprintjs foottrace
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack
      - name: Check the packed Lens with the canonical record owner
        run: |
          mkdir -p /tmp/extracted-peer-consumer
          cd /tmp/extracted-peer-consumer
          npm init -y >/dev/null
          if [ "${{ matrix.engine }}" = extracted10 ]; then
            engine="$GITHUB_WORKSPACE/engine-candidate/footprintjs-10.0.0.tgz"
          else
            engine=footprintjs@9.48.3
          fi
          npm install --strict-peer-deps --save-exact \
            agentfootprint@10.0.0 "$engine" foottrace@1.0.0 react@19.0.0 react-dom@19.0.0 \
            "@xyflow/react@^12.0.0" footprint-explainable-ui@0.38.2
          # The independent source build above is retained, but the consumer
          # still receives the ONE original Why artifact, not a lane rebuild.
          why_archive="$(node "$GITHUB_WORKSPACE/lens/scripts/compat/why-identity.mjs" --artifacts "$GITHUB_WORKSPACE/compat-artifacts")"
          npm install --strict-peer-deps "$why_archive"
          node "$GITHUB_WORKSPACE/lens/scripts/compat/check-existing-consumer.mjs" \
            --artifacts "$GITHUB_WORKSPACE/compat-artifacts" --consumer /tmp/extracted-peer-consumer \
            --evidence "$GITHUB_WORKSPACE/extracted-evidence" --phase before
          npm ls agentfootprint footprintjs foottrace
          cp "$GITHUB_WORKSPACE/lens/scripts/check-packed-peers.mjs" ./check-packed-peers.mjs
          node ./check-packed-peers.mjs
          npm install --strict-peer-deps --save-exact typescript@5.4.5 @types/node@22.12.0 @types/react@19.0.0 @types/react-dom@19.0.0
          cp "$GITHUB_WORKSPACE/lens/scripts/check-packed-peer-types.ts" ./check-packed-peer-types.mts
          cp "$GITHUB_WORKSPACE/lens/scripts/check-packed-peer-types.ts" ./check-packed-peer-types.cts
          cp "$GITHUB_WORKSPACE/lens/scripts/check-packed-peer-types.ts" ./check-packed-peer-types.ts
          npx tsc --noEmit --strict --skipLibCheck false --target ES2022 --module NodeNext --moduleResolution NodeNext check-packed-peer-types.mts check-packed-peer-types.cts
          npx tsc --noEmit --strict --skipLibCheck false --target ES2022 --module ESNext --moduleResolution Bundler check-packed-peer-types.ts
          node "$GITHUB_WORKSPACE/lens/scripts/compat/check-existing-consumer.mjs" \
            --artifacts "$GITHUB_WORKSPACE/compat-artifacts" --consumer /tmp/extracted-peer-consumer \
            --evidence "$GITHUB_WORKSPACE/extracted-evidence" --phase after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extracted-${{ matrix.engine }}
          path: |
            extracted-evidence/*.json
            /tmp/extracted-peer-consumer/package*.json
          if-no-files-found: error
