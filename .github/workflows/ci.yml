name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: footprintjs/explainable-ui
          ref: 0af1a2d0d21edb0a86fb447b4c032c1f3d896412
          path: flow-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check authored cohort development pins
        run: node scripts/compat/check-source-pins.mjs
      - run: npm install -g npm@11.21.0
      - name: Exercise every ordinary registry helper and the explicit native refusals
        run: node --test scripts/compat/*.test.mjs scripts/compat/source-inputs/*.test.mjs
      - name: Exercise the bounded hostile archive controls without installing packages
        run: python3 -B -m unittest discover -s scripts/compat/source-inputs/archive_data -t scripts/compat/source-inputs -p '*_test.py' -v
      - run: npm ci --strict-peer-deps
      - run: npm run test:contract:foottrace
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run fixtures:time:check
      - run: npm exec --no -- publint
      - name: Verify registry bytes, committed lock and installed packages
        run: node scripts/compat/published-proof.mjs --out "$RUNNER_TEMP/published-evidence" --lock package-lock.json
      - name: Read the independently reviewed renderer original
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/compat/source-inputs.mjs fetch-renderer --out "$RUNNER_TEMP/renderer-inputs"
      - name: Pack one Lens archive and bind it to stable AgentFootprint and the renderer original
        run: |
          mkdir -p compat-artifacts
          why_archive="$(node scripts/compat/why-identity.mjs)"
          npm pack --ignore-scripts --pack-destination compat-artifacts
          npm exec --no -- attw "compat-artifacts/$why_archive"
          node scripts/compat/prepare-artifacts.mjs \
            --why-tar "compat-artifacts/$why_archive" \
            --flow-source flow-candidate --out compat-artifacts \
            --renderer-inputs "$RUNNER_TEMP/renderer-inputs" \
            --published-evidence "$RUNNER_TEMP/published-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-archives
          path: |
            compat-artifacts/*.tgz
            compat-artifacts/*.json
            compat-artifacts/*.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-source-node22
          path: |
            ${{ runner.temp }}/published-evidence/*.json
            ${{ runner.temp }}/published-evidence/*.log
          if-no-files-found: warn

  test-24:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check authored cohort development pins
        run: node scripts/compat/check-source-pins.mjs
      - run: npm install -g npm@11.21.0
      - name: Exercise every ordinary registry helper and the explicit native refusals
        run: node --test scripts/compat/*.test.mjs scripts/compat/source-inputs/*.test.mjs
      - name: Exercise the bounded hostile archive controls without installing packages
        run: python3 -B -m unittest discover -s scripts/compat/source-inputs/archive_data -t scripts/compat/source-inputs -p '*_test.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-archives
          path: compat-artifacts
      - run: npm ci --strict-peer-deps
      - run: npm run test:contract:foottrace
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run fixtures:time:check
      - run: npm exec --no -- publint
      - name: Verify registry bytes, committed lock and installed packages
        run: node scripts/compat/published-proof.mjs --out "$RUNNER_TEMP/published-evidence" --lock package-lock.json
      - name: Compare Node 24’s build to the original Node 22 archive
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { publishedSourceFiles } from './scripts/compat/contract.mjs';
          import { inspectArchive } from './scripts/compat/process.mjs';
          import { assertWhyIdentity } from './scripts/compat/why-identity.mjs';

          const contract = JSON.parse(readFileSync('compat-artifacts/contract.json', 'utf8'));
          const identity = assertWhyIdentity(contract);
          assert.equal(contract.source.whyCommit, process.env.GITHUB_SHA);
          assert.equal(contract.source.workflowRun, process.env.GITHUB_RUN_ID);
          assert.equal(contract.source.workflowAttempt, process.env.GITHUB_RUN_ATTEMPT);
          const archive = inspectArchive(`compat-artifacts/${identity.filename}`, process.env.RUNNER_TEMP,
            { ...identity, expectedSha: contract.why.sha256 });
          assert.deepEqual(archive.files, publishedSourceFiles(process.cwd()));
          assert.deepEqual(archive.manifest, JSON.parse(readFileSync('package.json', 'utf8')));
          JS
          why_archive="$(node scripts/compat/why-identity.mjs)"
          npm exec --no -- attw "compat-artifacts/$why_archive"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-source-node24
          path: |
            ${{ runner.temp }}/published-evidence/*.json
            ${{ runner.temp }}/published-evidence/*.log
          if-no-files-found: warn

  published-commentary-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check authored cohort development pins
        run: node scripts/compat/check-source-pins.mjs
      - run: npm install -g npm@11.21.0
      - name: Bootstrap the separate published CONTROL directly, never through target AF15
        run: |
          node scripts/compat/source-inputs.mjs bootstrap --mode CONTROL --source "$GITHUB_WORKSPACE" --target "$RUNNER_TEMP/published-control" --evidence "$RUNNER_TEMP/control-evidence"
      - name: Preserve commentary assertions, build and the complete historical layout suite
        run: node scripts/compat/source-inputs.mjs gates --evidence "$RUNNER_TEMP/control-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-CONTROL-only
          path: |
            ${{ runner.temp }}/control-evidence/*.json
            ${{ runner.temp }}/control-evidence/*.log
          if-no-files-found: warn

  # Retire historical installed runtime cohorts. Keep historical record DATA
  # fixtures in the whole suite, plus public renderer floor/current/candidate.
  peer-matrix:
    needs: test
    runs-on: ubuntu-24.04
    # Official image supplies browsers + native libraries once; every lane still
    # proves its exact installed driver/binary and performs the full replay.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flow: ["0.34.0", "0.38.0", "candidate", "1.0.1", "2.0.0", "2.1.0"]
        react: ["18", "19"]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.flow == 'candidate'
        with:
          repository: footprintjs/explainable-ui
          ref: 0af1a2d0d21edb0a86fb447b4c032c1f3d896412
          path: flow-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check authored cohort development pins
        run: node scripts/compat/check-source-pins.mjs
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-archives
          path: compat-artifacts
      - name: Strict packed public runtime, declarations, native recording and browser replay
        run: |
          node scripts/compat/run-lane.mjs --kind native --flow "${{ matrix.flow }}" \
            --react "${{ matrix.react }}" --node "${{ matrix.node }}" \
            --artifacts compat-artifacts --evidence "$RUNNER_TEMP/compat-evidence" \
            --flow-source flow-candidate --install-browser yes --browser-provisioning bundled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.flow }}-react${{ matrix.react }}-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/compat-evidence/*.json
            ${{ runner.temp }}/compat-evidence/*.log
            ${{ runner.temp }}/compat-evidence/*.tgz
            ${{ runner.temp }}/compat-evidence/consumer/package*.json
            ${{ runner.temp }}/compat-evidence/consumer-resolve/package*.json
            ${{ runner.temp }}/compat-evidence/consumer/native-recording.json
            ${{ runner.temp }}/compat-evidence/consumer/expected-cohort.json
            ${{ runner.temp }}/compat-evidence/record-only/package*.json
            ${{ runner.temp }}/compat-evidence/record-only-resolve/package*.json
            ${{ runner.temp }}/compat-evidence/record-browser/package*.json
            ${{ runner.temp }}/compat-evidence/record-browser-resolve/package*.json
            ${{ runner.temp }}/compat-evidence/browser/**
          if-no-files-found: error
