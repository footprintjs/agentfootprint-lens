name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm PIN, and not a cosmetic one: npm 10 — what setup-node's node-22 still
      # ships — crashes resolving this dependency set with "Cannot read properties
      # of null (reading 'edgesOut')", an arborist bug tripped by a transitive
      # published after 2026-08-30. That is why 0.44.0's run was green and the very
      # next one was not, with no change to our own deps. Reproduced both ways:
      # npm 10.9.3 crashes, npm 11 resolves the same package.json cleanly. A
      # committed lockfile cannot paper over it (rolldown's native binding is a
      # platform optional dep, npm #4828), so the npm version IS the fix.
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run build
      - run: npm test
      # Packaging-correctness gate (dual CJS/ESM types + exports). attw exits non-zero on a
      # types masquerade / broken subpath; publint on a packaging error.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

  # Check both dependency resolution and the packed runtime contract. A successful
  # install alone cannot catch a renderer that lacks a statically imported API.
  # NEVER add --legacy-peer-deps / --force or downgrade smoke failures to warnings.
  peer-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Renderer minimum + current published version, across both React majors.
        # 0.31 first exports overlayFromSnapshot; 0.34 first adds runtime.seed
        # and collapseTraceGraph. Lens needs all three, so 0.34 is the floor.
        # Keep this minimum aligned with the peer/dev ranges in package.json.
        # Hold agentfootprint/footprintjs at their declared compatible floors.
        eui: ["0.34.0", "0.38.0"]
        react: ["18.3.1", "19.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm PIN, and not a cosmetic one: npm 10 — what setup-node's node-22 still
      # ships — crashes resolving this dependency set with "Cannot read properties
      # of null (reading 'edgesOut')", an arborist bug tripped by a transitive
      # published after 2026-08-30. That is why 0.44.0's run was green and the very
      # next one was not, with no change to our own deps. Reproduced both ways:
      # npm 10.9.3 crashes, npm 11 resolves the same package.json cleanly. A
      # committed lockfile cannot paper over it (rolldown's native binding is a
      # platform optional dep, npm #4828), so the npm version IS the fix.
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run build
      - run: npm pack # the exact tarball npm would publish

      - name: Install the packed lens against this peer combo (STRICT)
        run: |
          mkdir -p /tmp/scratch && cd /tmp/scratch && npm init -y >/dev/null
          npm install --strict-peer-deps --save-exact \
            "react@${{ matrix.react }}" "react-dom@${{ matrix.react }}" "@xyflow/react@^12.0.0" \
            "agentfootprint@9.116.0" "footprintjs@9.26.0" \
            "footprint-explainable-ui@${{ matrix.eui }}"
          npm install --strict-peer-deps "$GITHUB_WORKSPACE"/agentfootprint-lens-*.tgz

      - name: Check packed ESM/CJS exports, replay and React rendering
        run: |
          cd /tmp/scratch
          npm ls footprint-explainable-ui agentfootprint footprintjs react react-dom --depth=0
          cp "$GITHUB_WORKSPACE/scripts/check-packed-peers.mjs" ./check-packed-peers.mjs
          node ./check-packed-peers.mjs
          npm install --strict-peer-deps --save-exact typescript@5.4.5
          cp "$GITHUB_WORKSPACE/scripts/check-packed-peer-types.ts" ./check-packed-peer-types.mts
          cp "$GITHUB_WORKSPACE/scripts/check-packed-peer-types.ts" ./check-packed-peer-types.cts
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext check-packed-peer-types.mts check-packed-peer-types.cts

  # The next AgentFootprint major changes the nominal owner of boundary indexes.
  # Keep the four existing FLOOR combinations above; also build/typecheck/test
  # Lens against the actual, immutable next-major source, not a renamed 9.x tarball.
  # Replace this candidate lane with the published 10.x release during Lens E5.
  agent-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lens
    steps:
      - uses: actions/checkout@v4
        with:
          path: lens
      - uses: actions/checkout@v4
        with:
          repository: footprintjs/agentfootprint
          ref: 3dd2474d5868155784a7bef816f5473c71b61a37
          path: agent-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11
      - name: Build the exact AgentFootprint 10 candidate (never publish)
        working-directory: agent-candidate
        run: |
          test "$(git rev-parse HEAD)" = 3dd2474d5868155784a7bef816f5473c71b61a37
          npm ci
          node scripts/release-prepare.mjs --bump auto
          node -e "if(require('./package.json').version !== '10.0.0') process.exit(1)"
          npm run build
          npm pack --ignore-scripts
      - name: Install Lens against the candidate with unchanged peer declarations
        run: |
          npm pkg set devDependencies.agentfootprint=file:../agent-candidate/agentfootprint-10.0.0.tgz
          npm pkg set devDependencies.footprintjs=9.48.3
          npm install --strict-peer-deps
          npm ls agentfootprint footprintjs foottrace
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack
      - run: npm pack
      - name: Check the packed Lens with the real next-major boundary index
        run: |
          mkdir -p /tmp/agent-candidate-consumer
          cd /tmp/agent-candidate-consumer
          npm init -y >/dev/null
          npm install --strict-peer-deps --save-exact \
            "$GITHUB_WORKSPACE/agent-candidate/agentfootprint-10.0.0.tgz" \
            footprintjs@9.48.3 react@19.0.0 react-dom@19.0.0 \
            "@xyflow/react@^12.0.0" footprint-explainable-ui@0.38.0
          npm install --strict-peer-deps "$GITHUB_WORKSPACE"/lens/agentfootprint-lens-*.tgz
          cp "$GITHUB_WORKSPACE/lens/scripts/check-packed-peers.mjs" ./check-packed-peers.mjs
          node ./check-packed-peers.mjs
          npm install --strict-peer-deps --save-exact typescript@5.4.5
          cp "$GITHUB_WORKSPACE/lens/scripts/check-packed-peer-types.ts" ./check-packed-peer-types.mts
          cp "$GITHUB_WORKSPACE/lens/scripts/check-packed-peer-types.ts" ./check-packed-peer-types.cts
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext check-packed-peer-types.mts check-packed-peer-types.cts
