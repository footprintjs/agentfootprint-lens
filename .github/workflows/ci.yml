name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keep the required source-check name; every source gate uses the committed lock.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: footprintjs/explainable-ui
          ref: e3681ab46e01a2a03adf97a27d58df987fef4db8
          path: flow-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.21.0
      - run: npm ci --strict-peer-deps
      - name: Verify the installed registry candidate against the proven archive
        run: node scripts/compat/published-proof.mjs --out published-evidence-22 --lock package-lock.json
      - run: npm run test:compat-helpers
      - run: npm run test:contract:foottrace
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run fixtures:time:check
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack
      - name: Pack one Lens artifact and the exact reviewed renderer candidate
        run: |
          mkdir -p compat-artifacts
          why_archive="$(node scripts/compat/why-identity.mjs)"
          npm pack --ignore-scripts --pack-destination compat-artifacts
          node scripts/compat/prepare-artifacts.mjs \
            --why-tar "compat-artifacts/$why_archive" \
            --flow-source flow-candidate --out compat-artifacts \
            --agent-tar published-evidence-22/agentfootprint-14.0.0-rc.0.tgz \
            --agent-source published-evidence-22/published-agent.json --agent-profile published
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-archives
          path: |
            compat-artifacts/*.tgz
            compat-artifacts/contract.json
            compat-artifacts/agent-source.json
            compat-artifacts/*.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-source-node22
          path: |
            published-evidence-22/*.tgz
            published-evidence-22/*.json
            published-evidence-22/*.log
          if-no-files-found: error

  test-24:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-archives
          path: compat-artifacts
      - run: npm ci --strict-peer-deps
      - name: Verify the installed registry candidate against the proven archive
        run: node scripts/compat/published-proof.mjs --out published-evidence-24 --lock package-lock.json
      - run: npm run test:compat-helpers
      - run: npm run test:contract:foottrace
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run fixtures:time:check
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-source-node24
          path: |
            published-evidence-24/*.json
            published-evidence-24/*.log
          if-no-files-found: error

  # Retire historical installed runtime cohorts. Keep historical record DATA
  # fixtures in the whole suite, plus public renderer floor/current/candidate.
  peer-matrix:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flow: ["0.34.0", "0.38.0", "candidate"]
        react: ["18", "19"]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.flow == 'candidate'
        with:
          repository: footprintjs/explainable-ui
          ref: e3681ab46e01a2a03adf97a27d58df987fef4db8
          path: flow-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-archives
          path: compat-artifacts
      - run: npm ci --strict-peer-deps
      - name: Strict packed public runtime, declarations, native recording and browser replay
        run: |
          node scripts/compat/run-lane.mjs --kind native --flow "${{ matrix.flow }}" \
            --react "${{ matrix.react }}" --node "${{ matrix.node }}" \
            --artifacts compat-artifacts --evidence compat-evidence \
            --flow-source flow-candidate --install-browser yes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.flow }}-react${{ matrix.react }}-node${{ matrix.node }}
          path: |
            compat-evidence/*.json
            compat-evidence/*.log
            compat-evidence/*.tgz
            compat-evidence/consumer/package*.json
            compat-evidence/consumer/native-recording.json
            compat-evidence/record-only/package*.json
            compat-evidence/record-browser/package*.json
            compat-evidence/browser/**
          if-no-files-found: error

  bootstrap-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.21.0
      - name: Temporary normal strict install to produce the first committed lock
        run: |
          test ! -f package-lock.json
          npm install --strict-peer-deps
          node scripts/compat/published-proof.mjs --out bootstrap-evidence --lock package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: registry-lock-bootstrap
          path: |
            package-lock.json
            bootstrap-evidence/*.json
            bootstrap-evidence/*.log
          if-no-files-found: error
