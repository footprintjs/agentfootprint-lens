name: Context producer contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  context-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: footprintjs/agentfootprint
          ref: d507ab890fd705dddd2cef3aa73dd8859e14e2f2
          path: producer-agent
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: footprintjs/foottrace
          ref: 1b23607453bea28d0a8d846d0bac4029c6ea8f99
          path: producer-values
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check authored cohort development pins
        run: node scripts/compat/check-source-pins.mjs
      - run: npm install -g npm@11.21.0
      - run: node --test scripts/context-fixture/*.test.mjs
      - name: Read the fixed native source input with this workflow's existing token
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/compat/source-inputs.mjs fetch --out "$RUNNER_TEMP/native-inputs"
      - name: Bootstrap Lens independently from admitted current native originals
        run: |
          node scripts/compat/source-inputs.mjs bootstrap --mode target --source "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/native-inputs" --target "$RUNNER_TEMP/native-target" --evidence "$RUNNER_TEMP/native-evidence"
      - run: npm ci
        working-directory: producer-values
      - run: npm run build
        working-directory: producer-values
      - run: npm ci
        working-directory: producer-agent
      - run: npm run build
        working-directory: producer-agent
      - name: Generate from actual reviewed producer doors
        run: |
          node scripts/context-fixture/generate.mjs \
            --agent-head d507ab890fd705dddd2cef3aa73dd8859e14e2f2 \
            --values-head 1b23607453bea28d0a8d846d0bac4029c6ea8f99 \
            --agent-dir "$GITHUB_WORKSPACE/producer-agent" --values-dir "$GITHUB_WORKSPACE/producer-values" --out "$RUNNER_TEMP/context-producer.json" > context-producer-generation.log 2>&1
      - name: Read exact decoded values and model messages with admitted Lens peers
        working-directory: ${{ runner.temp }}/native-target
        run: |
          LENS_CONTEXT_FIXTURE="$RUNNER_TEMP/context-producer.json" \
            npx vitest run src/core/recordedContext/producer.test.ts > "$GITHUB_WORKSPACE/context-producer-read.log" 2>&1
      - name: Recheck actual native owners, original archives and all source bytes
        run: node scripts/compat/source-inputs.mjs verify --evidence "$RUNNER_TEMP/native-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-producer-proof
          path: |
            context-producer-*.log
            ${{ runner.temp }}/context-producer.json
            ${{ runner.temp }}/native-evidence/*.json
            ${{ runner.temp }}/native-evidence/*.log
          if-no-files-found: error
