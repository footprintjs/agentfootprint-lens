name: Context producer contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  published-context-shapes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --strict-peer-deps
      - name: Read an indexed recording with the published AgentFootprint reader
        env:
          LENS_CONTEXT_SHAPE_PEER: '16.0.1'
        run: |
          npm install --no-save --package-lock=false --strict-peer-deps agentfootprint@16.0.1
          npx --no-install vitest run test/context/contextValueShapes.test.tsx

  context-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: footprintjs/agentfootprint
          ref: d507ab890fd705dddd2cef3aa73dd8859e14e2f2
          path: producer-agent
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: footprintjs/foottrace
          ref: 1b23607453bea28d0a8d846d0bac4029c6ea8f99
          path: producer-values
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check authored cohort development pins
        run: node scripts/compat/check-source-pins.mjs
      - run: npm install -g npm@11.21.0
      - run: node --test scripts/context-fixture/*.test.mjs
      - run: npm ci --strict-peer-deps
      - run: npm ci
        working-directory: producer-values
      - run: npm run build
        working-directory: producer-values
      - run: npm ci
        working-directory: producer-agent
      - run: npm run build
        working-directory: producer-agent
      - name: Generate from actual reviewed producer doors
        run: |
          node scripts/context-fixture/generate.mjs \
            --agent-head d507ab890fd705dddd2cef3aa73dd8859e14e2f2 \
            --values-head 1b23607453bea28d0a8d846d0bac4029c6ea8f99 \
            --agent-dir "$GITHUB_WORKSPACE/producer-agent" --values-dir "$GITHUB_WORKSPACE/producer-values" --out "$RUNNER_TEMP/context-producer.json" > context-producer-generation.log 2>&1
      - name: Read exact decoded values and model messages with locked stable Lens peers
        run: |
          LENS_CONTEXT_FIXTURE="$RUNNER_TEMP/context-producer.json" \
            npx vitest run src/core/recordedContext/producer.test.ts > "$GITHUB_WORKSPACE/context-producer-read.log" 2>&1
      - name: Verify the installed producer consumer uses the locked registry cohort
        run: node scripts/compat/published-proof.mjs --out "$RUNNER_TEMP/published-evidence" --lock package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-producer-proof
          path: |
            context-producer-*.log
            ${{ runner.temp }}/context-producer.json
            ${{ runner.temp }}/published-evidence/*.json
            ${{ runner.temp }}/published-evidence/*.log
          if-no-files-found: error
