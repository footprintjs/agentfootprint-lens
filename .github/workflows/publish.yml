name: Publish to npm

on:
  release:
    types: [published]

# Least privilege at the top level: NO id-token here. The OIDC publish token is
# granted ONLY to the `publish` job below, which consumes a pre-built artifact and
# performs ZERO dependency resolution — so unpinned `npm install` (needed because
# rolldown's native binding is a platform optional dep, npm #4828) never shares a
# runtime with the registry token or `npm publish --provenance`.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Use the reviewed npm version with the committed lockfile.
      - run: npm install -g npm@11.19.0

      # Replay the committed lock with the same strict-peer command as CI.
      # This build job has no publish permission.
      - run: npm ci --strict-peer-deps
      - run: npm run build
      # Packaging regressions inspect dist, so they must run after the build.
      # Otherwise Vitest legitimately skips them in an unbuilt checkout.
      - run: npm test

      # Packaging-correctness gate — block a publish that would ship a types masquerade /
      # broken subpath export.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

      # Stage EXACTLY the published files for the privileged job. package.json `files`
      # is ["dist","README.md"]; npm always adds package.json + LICENSE.
      - name: Stage published package
        run: |
          mkdir -p pkg
          cp -R dist package.json README.md LICENSE pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: pkg/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — granted to THIS job only
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Pinned to the 11.x line: npm 12.0.0 went `latest` on 2026-07-08 with a broken
      # provenance path (MODULE_NOT_FOUND: sigstore) that fails `npm publish --provenance`.
      - run: npm install -g npm@11.19.0

      # Publishes the pre-built, verified artifact. No node_modules, no dependency
      # resolution — the privileged step only packs the dist + package.json that the
      # build job produced. Provenance is attested from the GitHub OIDC context.
      - name: Publish to npm
        run: npm publish --provenance --access public
