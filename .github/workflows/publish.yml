name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # `npm install` (not `npm ci`): vitest 4.x pulls rolldown's platform-native
      # binding as an OPTIONAL dep, and a lockfile generated on one OS doesn't list
      # the other OS's binding (npm bug #4828) — so `npm ci` (strict) fails on the
      # linux runner with "Cannot find @rolldown/binding-linux-x64-gnu". `npm install`
      # reconciles per-platform (adds the linux binding) while honoring the lock's
      # pinned agentfootprint. (This silently blocked the publish indirectly: the lock
      # had also gone stale at af 6.2.0 — regenerated to 6.44.0 in 0.23.3.)
      - run: npm install
      - run: npm test
      - run: npm run build

      # Trusted publishing requires npm >= 11.5.1, but newer npm
      # changes optional peer-dep resolution in ways that break our
      # test suite. Upgrade ONLY for the publish step, AFTER tests.
      - run: npm install -g npm@latest

      # Trusted publishing: no NODE_AUTH_TOKEN set. npm CLI authenticates
      # to the registry via the GitHub OIDC token (granted by id-token:
      # write permission above). npm verifies the publish is from a
      # trusted GitHub workflow per the package's trusted-publisher config.
      - name: Publish to npm
        run: npm publish --provenance --access public
