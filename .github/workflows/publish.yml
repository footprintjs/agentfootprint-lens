name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No `cache: npm` — it requires a committed lockfile, and we deliberately
          # don't commit one (see below).

      # NO committed lockfile + `npm install` (fresh per-platform resolve). Two reasons:
      #  1) vitest 4.x pulls rolldown's native binding as a PLATFORM optional dep; a
      #     lockfile generated on one OS omits the other OS's binding (npm #4828), so any
      #     committed lock breaks the linux runner ("Cannot find @rolldown/binding-linux-x64-gnu").
      #  2) The old committed lock had also gone stale at af 6.2.0 (pre-toolChoiceRecorder),
      #     which is what actually blocked the publish since v0.22.0.
      # A library's publish CI SHOULD test against the deps a consumer resolves (latest
      # compatible peer) — a fresh install does exactly that, on the correct platform.
      - run: npm install
      - run: npm test
      - run: npm run build

      # Trusted publishing requires npm >= 11.5.1, but newer npm
      # changes optional peer-dep resolution in ways that break our
      # test suite. Upgrade ONLY for the publish step, AFTER tests.
      - run: npm install -g npm@latest

      # Trusted publishing: no NODE_AUTH_TOKEN set. npm CLI authenticates
      # to the registry via the GitHub OIDC token (granted by id-token:
      # write permission above). npm verifies the publish is from a
      # trusted GitHub workflow per the package's trusted-publisher config.
      - name: Publish to npm
        run: npm publish --provenance --access public
